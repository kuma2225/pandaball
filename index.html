<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Pandaball Space Split – Pop Effect</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #ffffff;
        touch-action: manipulation; /* スマホのダブルタップ拡大を防止 */
      }
      canvas {
        background: #715fb7;
        border: 2px solid #715fb7;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const img = new Image();
      img.src = "pandaball.png";

      const popSound = new Audio("pon.mp3");
      const bgm = new Audio("utyuu.mp3");
      bgm.loop = true;
      bgm.volume = 0.2;

      let bgmStarted = false; // BGMが再生済みかどうか

      const gravity = 0;
      const bounceFactor = 1;
      const splitFactor = 2 / 3;
      const minSize = 16;
      const burstDuration = 12;
      const maxSpeed = 7;

      const starCount = 100;
      const stars = [];

      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random(),
          delta: Math.random() * 0.02 + 0.005,
        });
      }

      const balls = [
        {
          x: canvas.width / 2 - 24,
          y: canvas.height / 2 - 24,
          width: 128,
          height: 120,
          vx: 4,
          vy: 3,
          angle: 0,
          spin: 0.02,
          burstFrame: burstDuration,
        },
      ];

      function drawStars() {
        ctx.fillStyle = "#715fb7";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const star of stars) {
          star.alpha += star.delta;
          if (star.alpha <= 0 || star.alpha >= 1) {
            star.delta *= -1;
            star.alpha = Math.max(0, Math.min(1, star.alpha));
          }
          ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function update() {
        for (const b of balls) {
          b.vy += gravity;
          b.x += b.vx;
          b.y += b.vy;

          b.vx = Math.max(-maxSpeed, Math.min(maxSpeed, b.vx));
          b.vy = Math.max(-maxSpeed, Math.min(maxSpeed, b.vy));

          if (b.x <= 0 || b.x + b.width >= canvas.width) {
            b.vx *= -bounceFactor;
            b.x = Math.max(0, Math.min(canvas.width - b.width, b.x));
          }

          if (b.y <= 0 || b.y + b.height >= canvas.height) {
            b.vy *= -bounceFactor;
            b.y = Math.max(0, Math.min(canvas.height - b.height, b.y));
          }

          b.angle += b.spin;
        }

        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i];
            const b2 = balls[j];
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = (b1.width + b2.width) / 2;

            if (dist < minDist) {
              const angle = Math.atan2(dy, dx);
              const ax = Math.cos(angle) * 0.5;
              const ay = Math.sin(angle) * 0.5;

              b1.vx -= ax;
              b1.vy -= ay;
              b2.vx += ax;
              b2.vy += ay;
            }
          }
        }
      }

      function draw() {
        drawStars();

        for (const b of balls) {
          let scale = 1;
          let alpha = 1;
          if (b.burstFrame < burstDuration) {
            const t = b.burstFrame / burstDuration;
            scale = 0.5 + 0.5 * t;
            alpha = t;
            b.burstFrame++;
          }

          ctx.save();
          ctx.translate(b.x + b.width / 2, b.y + b.height / 2);
          ctx.rotate(b.angle);
          ctx.scale(scale, scale);
          ctx.globalAlpha = alpha;
          ctx.drawImage(img, -b.width / 2, -b.height / 2, b.width, b.height);
          ctx.restore();
          ctx.globalAlpha = 1;
        }
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      function handleClickOrTap(e) {
        if (!bgmStarted) {
          bgm.play();
          bgmStarted = true;
        }

        const rect = canvas.getBoundingClientRect();
        const mx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const my = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

        const newBalls = [];

        for (let i = balls.length - 1; i >= 0; i--) {
          const b = balls[i];
          const hit =
            mx >= b.x &&
            mx <= b.x + b.width &&
            my >= b.y &&
            my <= b.y + b.height;

          if (hit && b.width > minSize) {
            popSound.currentTime = 0;
            popSound.play();

            const newW = b.width * splitFactor;
            const newH = b.height * splitFactor;

            newBalls.push({
              x: b.x,
              y: b.y,
              width: newW,
              height: newH,
              vx: b.vx + 1,
              vy: b.vy + 1,
              angle: 0,
              spin: b.spin,
              burstFrame: 0,
            });

            newBalls.push({
              x: b.x + (b.width - newW),
              y: b.y + (b.height - newH),
              width: newW,
              height: newH,
              vx: b.vx - 1,
              vy: b.vy - 1,
              angle: 0,
              spin: -b.spin,
              burstFrame: 0,
            });

            balls.splice(i, 1);
          }
        }

        balls.push(...newBalls);
      }

      // クリックとタップの両方に対応
      canvas.addEventListener("click", handleClickOrTap);
      canvas.addEventListener("touchstart", handleClickOrTap);

      img.onload = () => loop();
    </script>
  </body>
</html>
