<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Pandaball Space Split – Pop Effect</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        touch-action: none; /* スマホのダブルタップ拡大防止 */
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
      }

      canvas {
        background: #715fb7;
        border: 2px solid #715fb7;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        touch-action: none; /* iPhone対応 */
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const img = new Image();
      img.src = "pandaball.png";

      const popSound = new Audio("pon.mp3");
      const bgm = new Audio("utyuu.mp3");
      bgm.loop = true;
      bgm.volume = 0.2;

      let bgmStarted = false;

      const gravity = 0;
      const bounceFactor = 1;
      const splitFactor = 2 / 3;
      const minSize = 16;
      const burstDuration = 12;
      const maxSpeed = 7;

      const stars = [];
      for (let i = 0; i < 100; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random(),
          delta: Math.random() * 0.02 + 0.005,
        });
      }

      const balls = [
        {
          x: canvas.width / 2 - 24,
          y: canvas.height / 2 - 24,
          width: 128,
          height: 120,
          vx: 4,
          vy: 3,
          angle: 0,
          spin: 0.02,
          burstFrame: burstDuration,
        },
      ];

      function drawStars() {
        ctx.fillStyle = "#715fb7";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          s.alpha += s.delta;
          if (s.alpha <= 0 || s.alpha >= 1) {
            s.delta *= -1;
            s.alpha = Math.max(0, Math.min(1, s.alpha));
          }
          ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function update() {
        for (const b of balls) {
          b.vy += gravity;
          b.x += b.vx;
          b.y += b.vy;

          b.vx = Math.max(-maxSpeed, Math.min(maxSpeed, b.vx));
          b.vy = Math.max(-maxSpeed, Math.min(maxSpeed, b.vy));

          if (b.x <= 0 || b.x + b.width >= canvas.width) {
            b.vx *= -bounceFactor;
            b.x = Math.max(0, Math.min(canvas.width - b.width, b.x));
          }

          if (b.y <= 0 || b.y + b.height >= canvas.height) {
            b.vy *= -bounceFactor;
            b.y = Math.max(0, Math.min(canvas.height - b.height, b.y));
          }

          b.angle += b.spin;
        }
      }

      function draw() {
        drawStars();
        for (const b of balls) {
          let scale = 1;
          let alpha = 1;
          if (b.burstFrame < burstDuration) {
            const t = b.burstFrame / burstDuration;
            scale = 0.5 + 0.5 * t;
            alpha = t;
            b.burstFrame++;
          }

          ctx.save();
          ctx.translate(b.x + b.width / 2, b.y + b.height / 2);
          ctx.rotate(b.angle);
          ctx.scale(scale, scale);
          ctx.globalAlpha = alpha;
          ctx.drawImage(img, -b.width / 2, -b.height / 2, b.width, b.height);
          ctx.restore();
          ctx.globalAlpha = 1;
        }
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      function handleInteraction(e) {
        e.preventDefault(); // Safari対応
        if (!bgmStarted) {
          bgm.play().catch(() => {}); // iOSの制限回避
          bgmStarted = true;
        }

        const rect = canvas.getBoundingClientRect();
        const mx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const my = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

        const newBalls = [];
        for (let i = balls.length - 1; i >= 0; i--) {
          const b = balls[i];
          if (
            mx >= b.x &&
            mx <= b.x + b.width &&
            my >= b.y &&
            my <= b.y + b.height &&
            b.width > minSize
          ) {
            popSound.currentTime = 0;
            popSound.play();
            const newW = b.width * splitFactor;
            const newH = b.height * splitFactor;

            newBalls.push({
              x: b.x,
              y: b.y,
              width: newW,
              height: newH,
              vx: b.vx + 1,
              vy: b.vy + 1,
              angle: 0,
              spin: b.spin,
              burstFrame: 0,
            });
            newBalls.push({
              x: b.x + (b.width - newW),
              y: b.y + (b.height - newH),
              width: newW,
              height: newH,
              vx: b.vx - 1,
              vy: b.vy - 1,
              angle: 0,
              spin: -b.spin,
              burstFrame: 0,
            });
            balls.splice(i, 1);
          }
        }
        balls.push(...newBalls);
      }

      canvas.addEventListener("click", handleInteraction, { passive: false });
      canvas.addEventListener("touchstart", handleInteraction, {
        passive: false,
      });

      img.onload = () => loop();
    </script>
  </body>
</html>
